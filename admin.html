<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel da Equipe | Auto Lucc</title><style>*{box-sizing:border-box}body{background:#0b0c0f;color:#f6f1e8;font-family:Arial,sans-serif;margin:0}main{max-width:980px;margin:30px auto;padding:18px}h1{color:#e9bd65}article{background:#1b1b1e;border:1px solid #655033;border-radius:14px;padding:22px;margin:16px 0}label{display:block;margin:12px 0 5px}input,select{width:100%;padding:13px;border-radius:8px;border:1px solid #66573f;background:#111114;color:#fff;font-size:16px}button{background:#ddb36b;color:#18130b;border:0;padding:13px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;border-block-end:1px solid #3e382e;padding:13px 0}.item select{max-width:230px}.code{color:#e9bd65;font-weight:800}.muted{color:#bbb;font-size:13px}a{color:#e9bd65}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{display:block}.item select{max-width:none}}</style></head><body><main><a href="/">← Voltar para o site</a><h1>Auto Lucc · Painel da equipe</h1><p class="muted">Acesso restrito. Utilize uma senha forte configurada no servidor. Os códigos gerados podem ser compartilhados com clientes para consulta.</p><article><label for="password">Senha da equipe</label><input id="password" type="password" placeholder="Senha administrativa" autocomplete="current-password"/><button id="connect">Entrar / Atualizar painel</button><p id="feedback" role="status"></p></article><div id="workspace" hidden><article><h2>Registrar veículo</h2><form id="createForm" class="grid"><div><label for="vehicle">Modelo do veículo</label><input id="vehicle" maxlength="60" placeholder="Ex.: T-Cross branco" required/></div><div><label for="stage">Etapa inicial</label><select id="stage"><option>Aguardando</option><option>Em lavagem</option><option>Finalização</option><option>Pronto para retirada</option></select></div><div><button type="submit">Criar acompanhamento</button></div></form><p id="created" role="status"></p></article><article><h2>Lavagens registradas</h2><div id="entries"></div></article></div></main><script>
const password=document.getElementById('password'),feedback=document.getElementById('feedback'),workspace=document.getElementById('workspace'),entries=document.getElementById('entries');
let secret='';const statuses=['Aguardando','Em lavagem','Finalização','Pronto para retirada'];
async function api(url,method='GET',data){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-Admin-Password':secret},body:data?JSON.stringify(data):undefined,cache:'no-store'});let j=await r.json();if(!r.ok)throw new Error(j.error||'Falha de comunicação');return j}
async function refresh(){const j=await api('/api/admin/vehicles');workspace.hidden=false;entries.replaceChildren();for(const v of j.vehicles){const row=document.createElement('div');row.className='item';const info=document.createElement('div');const code=document.createElement('span');code.className='code';code.textContent=v.code;const copy=document.createElement('button');copy.textContent='Copiar código';copy.style.margin='0 8px';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(v.code);copy.textContent='Copiado'}catch{window.prompt('Código',v.code)}});const desc=document.createElement('p');desc.className='muted';desc.textContent=v.vehicle+' · '+new Date(v.updatedAt).toLocaleString('pt-BR');info.append(code,copy,desc);const select=document.createElement('select');statuses.forEach(st=>{const o=document.createElement('option');o.value=o.textContent=st;if(v.status===st)o.selected=true;select.append(o)});select.addEventListener('change',async()=>{try{await api('/api/admin/vehicles/'+encodeURIComponent(v.code),'PATCH',{status:select.value});feedback.textContent='Status atualizado.';refresh()}catch(e){feedback.textContent=e.message}});row.append(info,select);entries.appendChild(row)}if(!j.vehicles.length)entries.textContent='Nenhum veículo registrado ainda.'}
document.getElementById('connect').addEventListener('click',async()=>{secret=password.value;try{await refresh();feedback.textContent='Painel conectado.'}catch(e){feedback.textContent=e.message;workspace.hidden=true}});
document.getElementById('createForm').addEventListener('submit',async e=>{e.preventDefault();try{const j=await api('/api/admin/vehicles','POST',{vehicle:document.getElementById('vehicle').value.trim(),status:document.getElementById('stage').value});document.getElementById('created').textContent='Código criado: '+j.code+' — informe esse código ao cliente.';document.getElementById('vehicle').value='';refresh()}catch(e){document.getElementById('created').textContent=e.message}})
</script></body></html>
